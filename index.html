
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#090b18">
    <meta name="description" content="بازی دوز نئونی؛ بازی دو نفره یا رقابت با کامپیوتر در سه درجه سختی.">

    <title>TIC TAC TOE | بازی دوز</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <main class="game-container">

        <!-- صفحه شروع -->
        <section id="home-screen" class="screen active">

            <div class="game-logo">
                <span class="logo-x">X</span>
                <span class="logo-o">O</span>
                <span class="logo-x">X</span>
            </div>

            <h1 class="main-title">TIC TAC TOE</h1>

            <p class="persian-title">بازی دوز</p>

            <p class="welcome-text">
                آماده‌ای برای یک رقابت هیجان‌انگیز؟
            </p>

            <div class="menu-buttons">

                <button id="two-player-btn" class="menu-btn">
                    <span>👥</span>
                    دو نفره
                </button>

                <button id="computer-btn" class="menu-btn">
                    <span>🤖</span>
                    بازی با کامپیوتر
                </button>

            </div>

        </section>


        <!-- صفحه انتخاب سختی -->
        <section id="difficulty-screen" class="screen">

            <h2 class="section-title">انتخاب درجه سختی</h2>

            <p class="section-description">
                دوست داری با چه سطحی رقابت کنی؟
            </p>

            <div class="difficulty-buttons">

                <button class="difficulty-btn easy" data-difficulty="easy">
                    آسان
                </button>

                <button class="difficulty-btn medium" data-difficulty="medium">
                    متوسط
                </button>

                <button class="difficulty-btn hard" data-difficulty="hard">
                    سخت
                </button>

            </div>

            <button id="back-home-btn" class="back-btn">
                بازگشت
            </button>

        </section>


        <!-- صفحه اصلی بازی -->
        <section id="game-screen" class="screen">

            <h2 class="game-heading">TIC TAC TOE</h2>

            <div id="game-frame" class="game-frame">

                <div id="turn-info" class="turn-info">
                    نوبت بازیکن X
                </div>

                <div id="game-board" class="game-board">

                    <button class="cell" data-index="0" aria-label="خانه ۱"></button>
                    <button class="cell" data-index="1" aria-label="خانه ۲"></button>
                    <button class="cell" data-index="2" aria-label="خانه ۳"></button>

                    <button class="cell" data-index="3" aria-label="خانه ۴"></button>
                    <button class="cell" data-index="4" aria-label="خانه ۵"></button>
                    <button class="cell" data-index="5" aria-label="خانه ۶"></button>

                    <button class="cell" data-index="6" aria-label="خانه ۷"></button>
                    <button class="cell" data-index="7" aria-label="خانه ۸"></button>
                    <button class="cell" data-index="8" aria-label="خانه ۹"></button>

                </div>

            </div>


            <!-- نتیجه بازی -->
            <div id="result-panel" class="result-panel hidden">

                <h2 id="result-title"></h2>

                <p id="result-message"></p>

                <div class="result-buttons">

                    <button id="restart-btn" class="menu-btn">
                        🔄 شروع دوباره
                    </button>

                    <button id="main-menu-btn" class="back-btn">
                        🏠 صفحه اول
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- امضای سازنده -->
    <footer class="creator-signature">
        ساخته شده توسط محمد امین مسگراف 💜
    </footer>


    <script src="script.js"></script>

</body>
</html>
